name: auto-release

# Automatic, label-driven releases, mirroring the convention already used by
# Musicarr-desktop.
#
# When a pull request is merged into main, this workflow works out the next
# version, tags it, builds a signed APK + AAB, and publishes them to a GitHub
# Release. No manual tagging.
#
# The bump level comes from a label on the PR:
#   - "major"      -> X+1.0.0   (breaking changes)
#   - "minor"      -> x.Y+1.0   (new features)
#   - "patch"      -> x.y.Z+1   (fixes; the default when no label is set)
#   - "no-release" -> skip releasing entirely
#
# versionCode is the commit count on main: monotonic by construction, needs no
# stored state, and never collides. Play Store requires it to strictly increase,
# and every release commit adds at least one.
#
# Without the signing secrets configured (see README), the build still runs and
# publishes an UNSIGNED APK, which is installable via adb but not by tapping it
# on a device and not uploadable to Play. Set the secrets to get a real release.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pick bump level
        id: level
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "level=${{ inputs.level }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" = "true" ]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" = "true" ]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Latest v-prefixed tag, or v0.0.0 for the very first release.
          last="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          [ -z "$last" ] && last="v0.0.0"
          IFS=. read -r major minor patch <<< "${last#v}"
          case "${{ steps.level.outputs.level }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          name="${major}.${minor}.${patch}"
          # Monotonic and stateless: one commit is one code.
          code="$(git rev-list --count HEAD)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Releasing v$name (versionCode $code)"

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — building UNSIGNED." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify before releasing
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed release
        if: steps.signing.outputs.signed == 'true'
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PkeystoreFile="$RUNNER_TEMP/release.jks" \
            -PkeystorePassword='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PkeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PkeyPassword='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Build unsigned release
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "release/Musicarr-${{ steps.version.outputs.name }}.$ext"
          done
          ls -la release

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Musicarr ${{ steps.version.outputs.name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Musicarr ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release/*
          body: |
            Android client for Musicarr — versionCode ${{ steps.version.outputs.code }}.

            ${{ steps.signing.outputs.signed == 'true' && 'Download the APK and install it on your device.' || '**Unsigned build** — signing secrets are not configured, so this APK can only be installed via `adb install`. See the README to set up signing.' }}
